name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    name: 📱 Compiler l'APK Android
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Récupérer le code source
        uses: actions/checkout@v4

      - name: ⚙️ Configuration Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: ☕ Configuration Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🤖 Configuration Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Installer les dépendances
        run: npm install

      - name: 🔨 Compiler le moteur métier (@rav/engine)
        run: npm run build:engine

      - name: ⚙️ Générer le projet natif Android
        run: |
          cd apps/mobile
          npx expo prebuild -p android --no-install --clean

      - name: 🚀 Compiler l'APK Android (Debug Installable)
        run: |
          cd apps/mobile/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 📤 Mettre l'APK en téléchargement (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: RAV-Mobile-App-Android
          path: apps/mobile/android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
