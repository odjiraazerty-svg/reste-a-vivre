version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: rav_postgres_db
    restart: always
    environment:
      POSTGRES_USER: rav_user
      POSTGRES_PASSWORD: rav_password_secure
      POSTGRES_DB: rav_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./apps/server/src/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rav_user -d rav_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
